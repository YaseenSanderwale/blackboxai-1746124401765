<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jhanko.com - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <header class="mb-8 text-center">
    <h1 class="text-4xl font-bold text-gray-800">jhanko.com Admin Panel</h1>
    <p class="text-gray-600 mt-2">Manage ads: approve, delete, download media</p>
  </header>

  <main class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <div id="loginSection" class="max-w-md mx-auto">
      <h2 class="text-2xl font-semibold mb-4">Admin Login</h2>
      <form id="loginForm" class="space-y-4">
        <input type="text" id="username" placeholder="Username" class="w-full border border-gray-300 rounded-md p-2" required />
        <input type="password" id="password" placeholder="Password" class="w-full border border-gray-300 rounded-md p-2" required />
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-md hover:bg-blue-700 transition-colors">Login</button>
      </form>
      <p id="loginMessage" class="mt-4 text-center text-red-600 font-semibold"></p>
    </div>

    <div id="adminPanel" class="hidden">
      <h2 class="text-2xl font-semibold mb-4">Ads Management</h2>
      <table class="w-full table-auto border-collapse border border-gray-300">
        <thead>
          <tr class="bg-gray-100">
            <th class="border border-gray-300 px-4 py-2">ID</th>
            <th class="border border-gray-300 px-4 py-2">Text</th>
            <th class="border border-gray-300 px-4 py-2">Media</th>
            <th class="border border-gray-300 px-4 py-2">Approved</th>
            <th class="border border-gray-300 px-4 py-2">Actions</th>
          </tr>
        </thead>
        <tbody id="adsTableBody"></tbody>
      </table>
      <button id="logoutBtn" class="mt-6 bg-red-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-red-700 transition-colors">Logout</button>
    </div>
  </main>

  <script>
    const loginSection = document.getElementById('loginSection');
    const adminPanel = document.getElementById('adminPanel');
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');
    const adsTableBody = document.getElementById('adsTableBody');
    const logoutBtn = document.getElementById('logoutBtn');

    let authHeader = null;

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMessage.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      authHeader = 'Basic ' + btoa(username + ':' + password);

      try {
        const response = await fetch('/admin/ads', {
          headers: { 'Authorization': authHeader }
        });
        if (response.ok) {
          loginSection.classList.add('hidden');
          adminPanel.classList.remove('hidden');
          loadAds();
        } else {
          loginMessage.textContent = 'Invalid credentials.';
        }
      } catch (error) {
        loginMessage.textContent = 'Error during login.';
      }
    });

    logoutBtn.addEventListener('click', () => {
      authHeader = null;
      adsTableBody.innerHTML = '';
      adminPanel.classList.add('hidden');
      loginSection.classList.remove('hidden');
      loginForm.reset();
    });

    async function loadAds() {
      try {
        const response = await fetch('/admin/ads', {
          headers: { 'Authorization': authHeader }
        });
        const ads = await response.json();
        adsTableBody.innerHTML = '';
        ads.forEach(ad => {
          const tr = document.createElement('tr');
          tr.classList.add('border', 'border-gray-300');
          tr.innerHTML = `
            <td class="border border-gray-300 px-4 py-2 text-center">${ad.id}</td>
            <td class="border border-gray-300 px-4 py-2">${ad.text ? ad.text : ''}</td>
            <td class="border border-gray-300 px-4 py-2 text-center">
              ${ad.media ? getMediaElement(ad) : ''}
            </td>
            <td class="border border-gray-300 px-4 py-2 text-center">${ad.approved ? '<i class="fas fa-check text-green-600"></i>' : '<i class="fas fa-times text-red-600"></i>'}</td>
            <td class="border border-gray-300 px-4 py-2 text-center space-x-2">
              ${!ad.approved ? `<button class="approveBtn bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700" data-id="${ad.id}">Approve</button>` : ''}
              <button class="deleteBtn bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700" data-id="${ad.id}">Delete</button>
              ${ad.media ? `<button class="downloadBtn bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700" data-id="${ad.id}">Download</button>` : ''}
            </td>
          `;
          adsTableBody.appendChild(tr);
        });
        addActionListeners();
      } catch (error) {
        alert('Failed to load ads.');
      }
    }

    function getMediaElement(ad) {
      if (ad.mediaType.startsWith('image/')) {
        return `<img src="/uploads/${ad.media}" alt="Ad Media" class="max-w-24 max-h-24 mx-auto rounded" />`;
      } else if (ad.mediaType.startsWith('video/')) {
        return `<video src="/uploads/${ad.media}" controls class="max-w-24 max-h-24 mx-auto rounded"></video>`;
      }
      return '';
    }

    function addActionListeners() {
      document.querySelectorAll('.approveBtn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          try {
            const response = await fetch(`/admin/ads/${id}/approve`, {
              method: 'POST',
              headers: { 'Authorization': authHeader }
            });
            if (response.ok) {
              loadAds();
            } else {
              alert('Failed to approve ad.');
            }
          } catch (error) {
            alert('Error approving ad.');
          }
        });
      });

      document.querySelectorAll('.deleteBtn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if (!confirm('Are you sure you want to delete this ad?')) return;
          try {
            const response = await fetch(`/admin/ads/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': authHeader }
            });
            if (response.ok) {
              loadAds();
            } else {
              alert('Failed to delete ad.');
            }
          } catch (error) {
            alert('Error deleting ad.');
          }
        });
      });

      document.querySelectorAll('.downloadBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          window.open(`/admin/ads/${id}/download?auth=${authHeader}`, '_blank');
        });
      });
    }
  </script>
</body>
</html>
